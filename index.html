<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Mate</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- HEADER / NAVBAR CHUNG -->
  <header class="header">
    <div class="logo-area">
      <span class="logo-text">Study</span>
      <span class="logobox">Mate</span>
    </div>
    <nav class="nav-menu">Trang chủ</nav>
    <nav class="nav-menu">Phòng học</nav>
    <nav class="nav-menu">Tìm bạn học</nav>
    <nav class="nav-menu">Feeds</nav>
    <nav class="nav-menu">Học bổng</nav>
    <div>
      <div class="header-login">Đăng nhập</div>
      <div class="header-actions">Vào phòng học</div>
    </div>
  </header>

  <main class="main-content">
    
    <section class="home">
      <div class="head">Online user now</div>
      <div>Tìm bạn học,</div>
      <div class="target">chinh phục mục tiêu</div>
      <div class="description">Không còn học một mình. Study Date kết nối bạn với những người cùng <br>mục tiêu, giúp
        bạn duy trì động
        lực và cam kết học tập mỗi ngày.</div>
    </section>


    <!-- SECTION 1: HERO & TỔNG QUAN / STATS -->
    <section class="hero-section">
      <div class="hero-text-block">1</div>
      <div class="hero-action-block">2</div>

      <div class="stats-overview-grid">
        <div class="stat-card">3</div>
        <div class="stat-card">4</div>
        <div class="stat-card">5</div>
        <div class="stat-card">6</div>
      </div>
    </section>

    <!-- SECTION 2: TIPS & ADVICE (LƯỚI 4 KHỐI) -->
    <section class="tips-section">
      <div class="tips-badge">Tips</div>
      <div class="tips-grid">
        <div class="advice-card">1</div>
        <div class="advice-card">2</div>
        <div class="advice-card">3</div>
        <div class="advice-card">4</div>
      </div>
    </section>

    <!-- SECTION 3: BẢNG XẾP HẠNG / LEADERBOARD & HOẠT ĐỘNG -->
    <section class="leaderboard-section">
      <div class="leaderboard-card">1</div>
      <div class="streak-card">2</div>
      <div class="online-card">3</div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer"></footer>

</body>

</html>
